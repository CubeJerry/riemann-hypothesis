name: Sheaf cohomology benchmarks
on:
  push:
    branches: [verify/sheaf-cohomology-benchmarks]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'CubeJerry/riemann-hypothesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_ABORT_ON_PANIC: '1'
      LAKE_ARTIFACT_CACHE: 'false'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Install the repository's Lean release
        run: |
          cp .github/scripts/verify-sheaf-cohomology.py "$RUNNER_TEMP/verify-sheaf-cohomology.py"
          git checkout --detach fe445c3f8e45458ab3cafce1e7f2a8c9cfd741e5
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Benchmark four targets, check consumers and replay on the queue head
        run: |
          ulimit -n 65536
          python3 -u "$RUNNER_TEMP/verify-sheaf-cohomology.py"
