name: P-adic norm bound import benchmark
on:
  push:
    branches: [verify/padic-norm-bound-imports]
    paths: [.github/workflows/padic-norm-bound-imports.yml, .github/scripts/padic-norm-bound-imports.py]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: '4.36.0'
            base: c592e91eb8f41bfd149227c09460fae0c17bf3c5
            head: 19d79f4930ac10aa5b252150bd952e83e116a589
            mathlib: fc4f59e577feb1a4956671bc04ac18aaaf8cd842
          - lane: '4.37.0-rc1'
            base: 9c9f665ed79ce0fa8da61bd803b7a4bf1ad62ed0
            head: 38ebced74503413221a5210adc7df7f1dfc906dc
            mathlib: 31ce06eaadf4a200c0e1407c5f10953cf606b8f8
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          sparse-checkout: .github/scripts/padic-norm-bound-imports.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.head }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Install locked Lean toolchain and fetch official Mathlib cache
        working-directory: source
        shell: bash
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
          BASE: ${{ matrix.base }}
        run: |
          git fetch --depth=1 origin "$BASE"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$ELAN_TOOLCHAIN"
          ulimit -n 65536
          lake exe mathlib/cache get
      - name: Benchmark the norm bound and build its direct consumer
        working-directory: source
        env:
          BENCH_OUTPUT: ${{ runner.temp }}/padic-import-bench
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          MATHLIB: ${{ matrix.mathlib }}
        run: python3 ../harness/.github/scripts/padic-norm-bound-imports.py "$BASE" "$HEAD" "$MATHLIB"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: padic-norm-bound-imports-${{ matrix.lane }}
          path: ${{ runner.temp }}/padic-import-bench
          if-no-files-found: warn
          retention-days: 14
