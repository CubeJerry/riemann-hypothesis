name: Targeted Lean builds
on:
  push:
    branches: [verify/dependency-reductions-lean437]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore upstream sources for the cache lookup
        run: |
          git fetch --no-tags --depth=200 https://github.com/leanprover-community/riemann-hypothesis.git +refs/heads/main:refs/remotes/upstream/main
          git checkout --detach 2746005d8130ee6d0c82d771ec11d69521a65093
      - name: Install the pinned toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore Mathlib and Tau Ceti
        run: |
          lake exe mathlib/cache get
          python3 scripts/tauceti-cache-get.py
      - name: Restore the project cache
        id: cache
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          result=0
          python3 scripts/ci-cache-get.py --baseline upstream/main || result=$?
          case "$result" in 0|4) ;; *) exit "$result" ;; esac
      - name: Build cm-field-adeles
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/Lib/General/NumberTheory/CMFields.lean
          git diff --check
          lake build Lib.General.NumberTheory.CMFields
      - name: Build normal-form-imports
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/New/Derivatives/Divisibility/NormalForm.lean
          git diff --check
          lake build New.Derivatives.Divisibility.NormalForm
      - name: Build frame-fibre-imports
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/Lib/DiscreteSeries/Bessel/FrameFibre.lean
          git diff --check
          lake build Lib.DiscreteSeries.Bessel.FrameFibre
      - name: Build colength-imports
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/New/UpperBound/Divisibility/ColengthAtLevel.lean
          git diff --check
          lake build New.UpperBound.Divisibility.ColengthAtLevel
      - name: Build appell-humbert-dependencies
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/Lib/Shimura/Uniformisation/AppellHumbert.lean
          git diff --check
          lake build Lib.Shimura.Uniformisation.AppellHumbert
      - name: Build siegel-lemma-dependencies
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: |
          git restore --source=HEAD -- src
          git restore --source="$GITHUB_SHA" -- src/New/Spanning/RemainingTerms/SiegelLemma.lean
          git diff --check
          lake build New.Spanning.RemainingTerms.SiegelLemma
