name: Denominator-clearing verification
on:
  push:
    branches: [verify/localization-span-denominators]
    paths: [.github/workflows/denominator-verification-workflow.yml, .github/scripts/denominator-verification-harness.py]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'CubeJerry/riemann-hypothesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: '4.36.0'
            base: 4f5b851cae6872352482cec54ae6f85ff9bae2c5
            head: c76ccd9231db91a362173d33dcd68caf1230fa9a
            mathlib: fc4f59e577feb1a4956671bc04ac18aaaf8cd842
            lean_commit: 611c117bfaf7b7ae1cfcf246ce6fba31e8f509e9
          - lane: '4.37.0-rc1'
            base: a78183e11ebfeebab77920b5e976f0a3edf1fc76
            head: d600a92ba01e36560cd965fc8e4ae40a0f45c1ec
            mathlib: 31ce06eaadf4a200c0e1407c5f10953cf606b8f8
            lean_commit: 0b77e12952ad39077d80d8bd6b66d601f225c321
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_ABORT_ON_PANIC: '1'
      LAKE_RESTORE_ARTIFACTS: 'false'
      LAKE_ARTIFACT_CACHE: 'false'
      ELAN_TOOLCHAIN: leanprover/lean4:v${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          sparse-checkout: .github/scripts/denominator-verification-harness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.head }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Install locked Lean toolchain and fetch official Mathlib cache
        working-directory: source
        shell: bash
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
          BASE: ${{ matrix.base }}
        run: |
          git fetch --depth=1 origin "$BASE"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$ELAN_TOOLCHAIN"
          ulimit -n 65536
          lake exe mathlib/cache get
      - name: Benchmark five modules and replay all compiled interfaces
        working-directory: source
        env:
          BENCH_OUTPUT: ${{ runner.temp }}/denominator-verification
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          MATHLIB: ${{ matrix.mathlib }}
          LEAN_COMMIT: ${{ matrix.lean_commit }}
        run: |
          ulimit -n 65536
          python3 ../harness/.github/scripts/denominator-verification-harness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: denominator-verification-${{ matrix.lane }}
          path: ${{ runner.temp }}/denominator-verification
          if-no-files-found: warn
          retention-days: 14
